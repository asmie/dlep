# dlep-router example configuration.
# Copy to /etc/dlep/router.toml and adjust paths and addresses.
# See doc/deployment.md for the full walkthrough.
#
# Unknown keys and sections are rejected. Validate all configuration values
# with `dlep-router --config <file> --check-config` (or dlep-modem).

# How the router finds its modem:
#   "discovery" — RFC 8175 UDP multicast Peer Discovery (default)
#   "static"    — connect directly to the addresses in static_peers
mode = "discovery"
# static_peers = ["192.0.2.10:854"]

# Free-text description sent in the Peer Type data item.
peer_description = "dlep-router"

[limits]
# Includes TCP/TLS attempts, initialization, established sessions, and shutdown.
max_sessions = 64
# Static peers are retained separately and never evicted from retry history.
max_discovered_peers = 256
# Failed retries do not extend this window. Fresh discovery can rediscover peers.
peer_retention_secs = 300

[network]
# Match the modem's router-facing link: "eui48" (default) or "eui64".
mac_address_format = "eui48"
# Interface for discovery sending, membership, and receive filtering.
# Must be up with an address in bind_addr's family and support multicast.
# IPv4: omit for bind_addr's interface or the default route.
# IPv6: set bind_addr = "::" and interface to use ff02::1:7 discovery.
# A concrete bind_addr must belong to this interface.
# interface = "eth0"
# Preferred discovery source and address family; not a TCP source bind.
# bind_addr = "0.0.0.0"
# Discovery destination port on the modem; the router binds an ephemeral port.
# TCP endpoints come from Peer Offers or static_peers, not network.tcp_port.
# The router needs CAP_NET_RAW for strict GTSM, but not CAP_NET_BIND_SERVICE.
discovery_port = 854
# TLS is on by default per the RFC's security guidance. With use_tls = true
# the [tls] section below is required.
use_tls = true

[tls]
# CA bundle used to verify the modem's certificate (required with TLS).
ca_bundle = "/etc/dlep/pki/ca.pem"
# Client certificate + key presented to the modem. Required if the modem
# sets require_client_cert = true; omit both for server-only TLS.
cert = "/etc/dlep/pki/router.pem"
key = "/etc/dlep/pki/router.key"

[timers]
# Heartbeat/discovery intervals must be >= 1000 ms.
# session_init_timeout_ms and any explicit termination_timeout_ms must be > 0.
# Omitted termination_timeout_ms uses 4 * heartbeat_interval_ms (240000 here).
# Set termination_timeout_ms explicitly only to override that recommendation.
heartbeat_interval_ms = 60000
discovery_interval_ms = 5000
