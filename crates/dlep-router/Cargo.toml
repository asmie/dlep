[package]
name = "dlep-router"
description = "DLEP (RFC 8175) router-side daemon binary"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["dlep", "rfc8175", "network", "routing"]
categories = ["network-programming"]

[[bin]]
name = "dlep-router"
path = "src/main.rs"

[dependencies]
dlep-daemon.workspace = true
tokio.workspace = true
clap.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
dlep-core.workspace = true
dlep-fsm.workspace = true
dlep-net = { workspace = true, features = ["test-helpers"] }
tempfile.workspace = true
nix = { workspace = true, features = ["signal"] }
rustls.workspace = true
