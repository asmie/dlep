name: Fuzz smoke checks

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - 'crates/dlep-core/**'
      - 'crates/dlep-fsm/**'
      - 'crates/dlep-net/**'
      - 'fuzz/**'
      - '.github/scripts/seed-fuzz.py'
      - '.github/workflows/fuzz.yml'
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - 'crates/dlep-core/**'
      - 'crates/dlep-fsm/**'
      - 'crates/dlep-net/**'
      - 'fuzz/**'
      - '.github/scripts/seed-fuzz.py'
      - '.github/workflows/fuzz.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [wire_decode, session_sequence, discovery_sequence, message_framing]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - run: cargo fetch --manifest-path fuzz/Cargo.toml --locked
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: python3 -B .github/scripts/seed-fuzz.py
      - name: Verify structured session inputs reach protocol outcomes
        if: matrix.target == 'session_sequence'
        run: cargo test --manifest-path fuzz/Cargo.toml --test structured_sessions --locked --offline
      - name: Run bounded AddressSanitizer fuzzing
        env:
          CARGO_NET_OFFLINE: 'true'
        # Prebuilt cargo-fuzz may default to its own musl build platform. Use
        # the GNU target installed with nightly on this Ubuntu x86-64 runner.
        run: cargo +nightly fuzz run '${{ matrix.target }}' --target x86_64-unknown-linux-gnu -- -max_total_time=30 -max_len=65545 -timeout=5 -rss_limit_mb=2048
      - name: Verify fuzz dependency resolution stayed locked
        if: always()
        run: git diff --exit-code -- fuzz/Cargo.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
            fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 14
