name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # actionlint is a Go binary, unsupported by install-action's Rust fallback.
      - name: Install actionlint from its verified upstream release
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint"'
      # The audit is path-filtered; catch an omitted policy on every CI run.
      - name: Verify audit policy is included in the checkout
        run: git ls-files --error-unmatch .cargo/audit.toml
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      # Strict TCP GTSM tests need CAP_NET_RAW. Keep capabilities and network
      # changes inside a temporary namespace, using the already built suite.
      - name: Test with strict GTSM in an isolated network namespace
        run: |
          sudo env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" \
            bash .github/scripts/test-network.sh cargo test --workspace --locked --offline

  msrv:
    name: Rust 1.85 minimum supported version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked

  release:
    name: release packages and CLI smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Online mode is needed for Cargo's temporary registry checksum lookup.
      # This builds archives and verifies them without publishing anything.
      - run: cargo package --workspace --locked
      # Package verification builds normal targets, not every test dependency.
      # Populate the complete locked dependency set before offline test builds.
      - name: Fetch locked dependencies for archived tests
        run: cargo fetch --locked
      - run: python3 .github/scripts/check-release-packages.py
      - name: Exercise installed release commands with strict GTSM
        run: |
          sudo env "PATH=$PATH" bash .github/scripts/test-network.sh \
            python3 .github/scripts/release-smoke.py --bin-dir target/release-install/bin

  macos:
    name: macOS portable protocol crates
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Strict TCP reset monitoring and the transport implementation require
      # Linux. This job checks portability of the codec, FSM, and plug-in API;
      # it does not claim macOS daemon support.
      - run: cargo test -p dlep-core -p dlep-fsm -p dlep-ext --all-features --locked

  coverage:
    name: Linux workspace coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # Fetch while networking is available; the test namespace is isolated.
      - run: cargo fetch --locked
      - name: Instrument, test with strict GTSM, and generate reports
        run: |
          sudo env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" \
            bash .github/scripts/test-network.sh \
            bash .github/scripts/coverage.sh
      # llvm-cov creates private HTML directories as root. The upload action
      # runs as the runner user and must be able to traverse those directories.
      - name: Return coverage reports to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" target/coverage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-workspace-coverage
          path: target/coverage/
          if-no-files-found: error
          retention-days: 14
