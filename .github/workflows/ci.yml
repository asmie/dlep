name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: actionlint@1.7.12
      - run: actionlint
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      # Strict TCP GTSM tests need CAP_NET_RAW. Keep capabilities and network
      # changes inside a temporary namespace, using the already built suite.
      - name: Test with strict GTSM in an isolated network namespace
        run: |
          sudo env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" \
            bash .github/scripts/test-network.sh cargo test --workspace --locked --offline

  msrv:
    name: Rust 1.85 minimum supported version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked

  macos:
    name: macOS portable protocol crates
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Strict TCP reset monitoring and the transport implementation require
      # Linux. This job checks portability of the codec, FSM, and plug-in API;
      # it does not claim macOS daemon support.
      - run: cargo test -p dlep-core -p dlep-fsm -p dlep-ext --all-features --locked

  coverage:
    name: Linux workspace coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # Fetch while networking is available; the test namespace is isolated.
      - run: cargo fetch --locked
      - name: Instrument, test with strict GTSM, and generate reports
        run: |
          sudo env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" \
            bash .github/scripts/test-network.sh \
            bash .github/scripts/coverage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-workspace-coverage
          path: target/coverage/
          if-no-files-found: error
          retention-days: 14
