[package]
name = "dlep"
description = "DLEP (RFC 8175) router and modem daemons"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["dlep", "rfc8175", "network", "routing"]
categories = ["network-programming", "command-line-utilities"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
dlep-router = { path = "crates/dlep-router", version = "0.2.0" }
dlep-modem = { path = "crates/dlep-modem", version = "0.2.0" }

[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Piotr Olszewski <asmie@asmie.pl>"]
repository = "https://github.com/asmie/dlep"
rust-version = "1.85"

[workspace.dependencies]
# protocol / core
bytes = "1"
thiserror = "2"
ipnet = "2"

# async runtime + io
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
] }
tokio-util = { version = "0.7", features = ["codec"] }

# TLS
tokio-rustls = "0.26"
rustls = "0.23.45"
rustls-pki-types = { version = "1.9", features = ["std"] }
tempfile = "3"

# sockets / os
socket2 = { version = "0.5", features = ["all"] }
nix = { version = "0.31", features = ["socket", "net", "uio"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI / config
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1.0.103"

# internal crates
dlep-core = { path = "crates/dlep-core", version = "0.2.0" }
dlep-fsm = { path = "crates/dlep-fsm", version = "0.2.0" }
dlep-net = { path = "crates/dlep-net", version = "0.2.0" }
dlep-ext = { path = "crates/dlep-ext", version = "0.2.0" }
dlep-daemon = { path = "crates/dlep-daemon", version = "0.2.0" }
